<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>후원 페이지</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .donation-box {
      max-width: 500px;
      margin: 80px auto;
      padding: 30px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .qr-image {
      width: 200px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="donation-box text-center">
    <h2 class="mb-4">🙏 후원하기</h2>
    <p>이 페이지는 창작 활동 및 프로젝트 운영을 위한 자율 후원 페이지입니다.</p>

    <div class="mt-4">
      <h5>계좌번호</h5>
      <p><strong>카카오뱅크 3333-05-0011978</strong><br>(예금주: 김효은)</p>
      <img src="images/account_qr.jpg" alt="계좌 QR코드" class="qr-image">
      <p class="mt-2 text-muted">QR코드를 스캔하면 간편송금이 가능합니다.</p>
    </div>

    <hr>
    <p class="text-muted" style="font-size: 0.9rem;">여러분의 후원은 큰 힘이 됩니다. 감사합니다!</p>
  </div>

</body>
</html>
